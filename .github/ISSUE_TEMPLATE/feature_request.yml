name: Funktionsvorschlag
description: Eine begrenzte Verbesserung für LDTG vorschlagen
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Beschreibe bitte zuerst das Problem und den Nutzen. Ein Vorschlag ist keine Zusage auf Umsetzung oder Zeitplan.
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Gewünschte Lösung
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Bereits mögliche Alternativen
  - type: textarea
    id: impact
    attributes:
      label: Sicherheits- und Datenschutzfolgen
      description: Nenne neue Netzwerkzugriffe, gespeicherte Daten, Systemänderungen oder Berechtigungen; andernfalls „keine“.
    validations:
      required: true
