[package]
name = "dmdc"
version = "0.2.0-rc.2"
default-run = "dmdc"
description = "Lokaler Dateitransfer zwischen Desktop und Mobilgerät"
authors = ["DMDC"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "dmdc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dmdc"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
async-stream = "0.3"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "service", "tokio"] }
if-addrs = "0.15"
mime_guess = "2"
percent-encoding = "2"
rand = "0.10"
rust-embed = { version = "8", features = ["compression"] }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "11.1"
tower = { version = "0.5", features = ["util"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
